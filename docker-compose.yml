version: "3.8"

services:
  app:
    build: .
    container_name: dev_quest_app
    ports:
      - "19006:19006"   # Expo Web
      - "8081:8081"     # Metro Bundler
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CI=true

  # Descomente este serviço se o projeto passar a usar Firebase Functions
